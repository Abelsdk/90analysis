[project]
name = "ninety"
version = "0.1.0"
description = "Open-source soccer prediction and scouting engine built on xG"
readme = "README.md"
authors = [
    { name = "Abdul El Saddik", email = "abelsaddik@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pandas>=3.1.0",
]

[project.scripts]
ninety = "ninety:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
